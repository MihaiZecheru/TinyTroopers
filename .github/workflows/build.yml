name: Build and Package Client

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build TinyTroopersClient
        run: |
          cmake --build build --config Release --target TinyTroopersClient

      - name: Package Windows Release
        shell: pwsh
        run: |
          $packageDir = "TinyTroopers-Windows"
          New-Item -ItemType Directory -Path $packageDir -Force

          # Copy executable (search both MSVC Release subfolder and root build folder)
          if (Test-Path "build/Release/TinyTroopersClient.exe") {
              Copy-Item "build/Release/TinyTroopersClient.exe" -Destination "$packageDir/"
          } elseif (Test-Path "build/TinyTroopersClient.exe") {
              Copy-Item "build/TinyTroopersClient.exe" -Destination "$packageDir/"
          }

          # Copy assets and readme
          Copy-Item -Recurse "assets" -Destination "$packageDir/"
          if (Test-Path "README.md") {
              Copy-Item "README.md" -Destination "$packageDir/"
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyTroopers-Client-Windows
          path: TinyTroopers-Windows/

  build-macos:
    name: Build macOS Client (Universal - Apple Silicon + Intel)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # raylib is built from source and linked statically (FETCH_RAYLIB=ON) so the
      # binary runs on any Mac, not just ones with Homebrew's raylib installed.
      # Building for both architectures produces a single universal binary.
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCH_RAYLIB=ON \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build TinyTroopersClient
        run: |
          cmake --build build --config Release --target TinyTroopersClient -j "$(sysctl -n hw.ncpu)"

      - name: Verify binary is universal and self-contained
        run: |
          lipo -archs build/TinyTroopersClient
          otool -L build/TinyTroopersClient
          if otool -L build/TinyTroopersClient | grep -qE '/opt/homebrew|/usr/local'; then
            echo "::error::Binary links against Homebrew libraries and will not run on other Macs"
            exit 1
          fi

      - name: Package macOS Release
        run: |
          mkdir -p TinyTroopers-macOS

          BIN_PATH="build/TinyTroopersClient"

          # Standalone binary package
          cp "$BIN_PATH" TinyTroopers-macOS/TinyTroopersClient
          chmod +x TinyTroopers-macOS/TinyTroopersClient
          cp -r assets TinyTroopers-macOS/
          [ -f "README.md" ] && cp README.md TinyTroopers-macOS/

          # Create RunGame.command launcher script
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\ncd "$DIR"\nchmod +x ./TinyTroopersClient 2>/dev/null || true\n./TinyTroopersClient\n' > TinyTroopers-macOS/RunGame.command
          chmod +x TinyTroopers-macOS/RunGame.command

          # Create macOS .app Bundle
          APP_DIR="TinyTroopers-macOS/TinyTroopers.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/TinyTroopersClient"
          chmod +x "$APP_DIR/Contents/MacOS/TinyTroopersClient"
          # Assets go in Resources only: non-code files in Contents/MacOS get their signatures
          # stored in extended attributes, which zip drops, making macOS report the app as "damaged"
          cp -r assets "$APP_DIR/Contents/Resources/"

          cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>TinyTroopersClient</string>
              <key>CFBundleIdentifier</key>
              <string>com.tinytroopers.client</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>TinyTroopers</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF
          sed -i '' -e 's/^[[:space:]]*//' "$APP_DIR/Contents/Info.plist" 2>/dev/null || sed -i -e 's/^[[:space:]]*//' "$APP_DIR/Contents/Info.plist"

          # Ad-hoc sign the finished bundle so its signature covers Info.plist and resources.
          # Without this the bundle's signature is broken and macOS says the app "is damaged".
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyTroopers-Client-macOS
          path: TinyTroopers-macOS/

  create-release:
    name: Create GitHub Release
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: TinyTroopers-Client-Windows
          path: TinyTroopers-Windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: TinyTroopers-Client-macOS
          path: TinyTroopers-macOS

      - name: Create Release Zip Archives
        run: |
          cd TinyTroopers-Windows && zip -r ../TinyTroopers-Client-Windows.zip . && cd ..

          chmod +x TinyTroopers-macOS/TinyTroopersClient || true
          chmod +x TinyTroopers-macOS/RunGame.command || true
          chmod -R +x TinyTroopers-macOS/TinyTroopers.app/Contents/MacOS || true
          cd TinyTroopers-macOS && zip -ry ../TinyTroopers-Client-macOS.zip . && cd ..

      - name: Determine Release Info & Update Rolling Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "name=Latest Build" >> $GITHUB_OUTPUT
            git tag -f latest
            git push -f origin latest
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          make_latest: true
          files: |
            TinyTroopers-Client-Windows.zip
            TinyTroopers-Client-macOS.zip
          generate_release_notes: true
